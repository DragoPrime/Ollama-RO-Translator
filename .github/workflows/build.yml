name: Build & Release plugin

# Se declanseaza cand impingi un tag de forma v1.0.0.0
on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Setup Python (pentru jprm)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instaleaza jprm
        run: pip install jprm

      - name: Build plugin (dotnet + impachetare zip)
        run: jprm plugin build . --output ./artifacts --version "${{ github.ref_name }}"

      - name: Determina fisierul zip generat
        id: zipfile
        run: |
          ZIP_PATH=$(ls ./artifacts/*.zip | head -n 1)
          echo "path=$ZIP_PATH" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$ZIP_PATH")" >> "$GITHUB_OUTPUT"

      - name: Creeaza Release pe GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.zipfile.outputs.path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Actualizeaza manifest.json cu noua versiune
        run: |
          jprm repo add \
            --url "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/${{ steps.zipfile.outputs.name }}" \
            manifest.json \
            "${{ steps.zipfile.outputs.path }}"

      - name: Commit manifest.json actualizat
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git commit -m "chore: actualizeaza manifest.json pentru ${{ github.ref_name }}" || echo "Nimic de comis"
          git push origin HEAD:main
